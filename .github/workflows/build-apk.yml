name: Build MangaYomu APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Android project from ZIP
        run: |
          test -f MangaYomu-GitHub-Ready.zip
          unzip -n MangaYomu-GitHub-Ready.zip -d .
          test -f app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Launch app in Android emulator (smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            gradle connectedDebugAndroidTest --stacktrace
            TEST_STATUS=$?
            mkdir -p app/build/outputs
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|com\\.mangayomu' | tail -n 250 > app/build/outputs/startup-logcat.txt || true
            cat app/build/outputs/startup-logcat.txt
            exit $TEST_STATUS

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Startup-Diagnostics
          path: app/build/outputs/startup-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
