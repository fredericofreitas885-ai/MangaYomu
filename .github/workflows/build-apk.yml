name: Build MangaYomu APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Android project from ZIP
        run: |
          test -f MangaYomu-GitHub-Ready.zip
          unzip -n MangaYomu-GitHub-Ready.zip -d .
          test -f app/build.gradle.kts
      - name: Translate app interface to Portuguese
        run: python .github/scripts/localize_pt.py
      - name: Upload restored Android sources for localization review
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Restored-Source
          path: |
            app/src/main/**
            app/src/androidTest/**
            app/src/test/**
            app/build.gradle.kts
            build.gradle.kts
            settings.gradle.kts
          if-no-files-found: warn
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Launch app in Android emulator (smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            mkdir -p app/build/outputs
            adb logcat -c
            gradle installDebug --stacktrace
            adb shell am force-stop com.mangayomu
            adb shell am start -n com.mangayomu/.MainActivity || true
            sleep 8
            adb logcat -d -v threadtime > app/build/outputs/startup-logcat-full.txt
            adb shell pidof com.mangayomu
            ! grep -q 'FATAL EXCEPTION' app/build/outputs/startup-logcat-full.txt

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Startup-Diagnostics
          path: app/build/outputs/startup-logcat-full.txt
          if-no-files-found: ignore
          retention-days: 7

