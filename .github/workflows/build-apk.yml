name: Build MangaYomu APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Android project from ZIP
        run: |
          test -f MangaYomu-GitHub-Ready.zip
          unzip -n MangaYomu-GitHub-Ready.zip -d .
          test -f app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Launch app in Android emulator (smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            set -u
            mkdir -p app/build/outputs
            adb logcat -c
            gradle installDebug --stacktrace
            adb shell am force-stop com.mangayomu
            adb shell am start -W -n com.mangayomu/.MainActivity || true
            sleep 8
            adb logcat -d -v threadtime > app/build/outputs/startup-logcat-full.txt
            if ! adb shell pidof com.mangayomu >/dev/null 2>&1; then
              echo "ERROR: com.mangayomu process is not running after launch."
              grep -n -A45 -B5 -E 'FATAL EXCEPTION|Process: com.mangayomu|AndroidRuntime' app/build/outputs/startup-logcat-full.txt || true
              exit 1
            fi
            echo "PASS: com.mangayomu process survived startup."
            grep -n -A45 -B5 -E 'FATAL EXCEPTION|Process: com.mangayomu|AndroidRuntime' app/build/outputs/startup-logcat-full.txt || true

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Startup-Diagnostics
          path: app/build/outputs/startup-logcat-full.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaYomu-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
